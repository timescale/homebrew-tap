name: Verify formula downloads

on:
  pull_request:
    paths:
      - '*.rb'
  push:
    branches: [main]
    paths:
      - '*.rb'

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        id: setup
        with:
          stable: true

      - name: Fetch and verify changed formula downloads
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TAP: ${{ steps.setup.outputs.tap-name }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
        shell: bash
        run: |
          git diff --no-renames --name-only --diff-filter=AM -z "$BASE_SHA" HEAD -- ':(top,glob)*.rb' |
            while IFS= read -r -d '' formula; do
              brew fetch --build-from-source "$TAP/${formula%.rb}"
            done
